<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garçom</title>
    <h1>Não tem garçom de cara feia</h1>
</head>
<body>
    <div>
        <label for="salario">Salário</label>
    <input type="text" id="salario" required placeholder="Digite seu Salário">
    </div>
    <div>
        <label for="emprestimo">Empréstimo:</label>
     <input type="text" id="emprestimo" required placeholder="Digite o Valor do emprestimo">
    </div>
    <div>
        <label for="num_pres">Prestações</label> 
        <input type="number" id="num_pres" required placeholder="Digite o num que deseja pagar:">
    </div>

    <!-- required placeholder é oq vai aparecer dentro da caixa de digitar -->
     <output id="resultado"></output>
    <div>
    <button onclick="garçom()">Enviar</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
