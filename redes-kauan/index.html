<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaka - Official Bio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Resets Básicos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Fundo com imagem e desfoque inicial leve */
        #background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://i.postimg.cc/8cCvKZR5/9fabc88e-978c-4155-b754-06c334bd315f.webp') center/cover no-repeat;
            filter: blur(4px) brightness(0.2); /* Desfoque inicial */
            z-index: -1;
            transition: filter 1.5s ease, transform 1.5s ease;
        }

        /* Tela de Entrada (Clique) */
        #click-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        .click-text {
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.5);
            animation: pulse 2s infinite;
        }

        /* Selo "Criado por Kaka" no canto direito */
        .creator-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #cbd5e1;
            color: #1e293b;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            
            /* Inicia invisível e só aparece após o clique (com delay) */
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 1s ease 0.5s, transform 1s ease 0.5s; 
        }

        /* Classe ativada pelo JS para mostrar o selo */
        .creator-badge.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Card Principal Estilo Glassmorphism */
        .container {
            width: 360px;
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 50px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            
            transition: transform 0.2s ease-out, opacity 1s ease;
            transform-style: preserve-3d;
            
            opacity: 0;
            pointer-events: none;
            position: relative;
        }

        .container.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Avatar e Textos */
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: url('https://i.postimg.cc/c1TMRnRH/61722761-38b8-4340-9d48-96bf5dc8367e.webp') center/cover;
            margin: 0 auto 15px;
            border: 2px solid rgba(255,255,255,0.08);
            transform: translateZ(50px);
        }

        .name { font-size: 1.5rem; font-weight: 700; transform: translateZ(40px); }
        .bio { font-size: 0.75rem; color: #777; margin-bottom: 35px; transform: translateZ(30px); }

        /* Botões das Redes */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateZ(20px);
        }

        .link-btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            color: #ddd;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease-out;
            position: relative;
        }

        .link-btn i {
            margin-right: 15px;
            width: 20px;
            text-align: center;
            font-size: 1.1rem;
            transition: text-shadow 0.3s ease-out;
        }

        .link-btn:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Glow dos Ícones */
        .link-btn:hover .fa-tiktok { text-shadow: 0 0 8px rgba(0, 242, 234, 0.8), 0 0 15px rgba(255, 0, 80, 0.6); }
        .link-btn:hover .fa-instagram { text-shadow: 0 0 8px rgba(214, 36, 159, 0.8), 0 0 15px rgba(253, 89, 73, 0.6); }
        .link-btn:hover .fa-twitch { text-shadow: 0 0 8px rgba(145, 70, 255, 0.8), 0 0 15px rgba(145, 70, 255, 0.6); }
        .link-btn:hover .fa-discord { text-shadow: 0 0 8px rgba(88, 101, 242, 0.8), 0 0 15px rgba(88, 101, 242, 0.6); }

        /* Contador de Views */
        .views-counter {
            position: absolute;
            bottom: 18px;
            left: 25px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            transform: translateZ(10px);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 0.8; transform: scale(1); }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="minha-musica.mp3" type="audio/mpeg">
    </audio>

    <div id="background"></div>

    <div id="click-overlay">
        <div class="click-text">CLIQUE PARA ENTRAR</div>
    </div>

    <div class="creator-badge" id="creator-badge">
        Criado por Kaka
    </div>

    <div class="container" id="tilt-card">
        <div class="avatar"></div>
        <h1 class="name">KAKA</h1>
        <p class="bio">Minhas Redes - Criador de Conteúdo de GTA RP</p>

        <div class="links-container">
            <a href="https://www.tiktok.com/@kakaatvv" target="_blank" class="link-btn btn-tiktok"><i class="fa-brands fa-tiktok"></i> TikTok</a>
            <a href="https://www.instagram.com/kauz.rxyz" target="_blank" class="link-btn btn-insta"><i class="fa-brands fa-instagram"></i> Instagram</a>
            <a href="https://twitch.tv/kakaatv" target="_blank" class="link-btn btn-twitch"><i class="fa-brands fa-twitch"></i> Twitch</a>
            <a href="https://discord.gg/Ymt62zk5M7" target="_blank" class="link-btn btn-discord"><i class="fa-brands fa-discord"></i> Discord</a>
        </div>

        <div class="views-counter">
            <i class="fa-regular fa-eye"></i>
            <span id="view-number">8271</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
